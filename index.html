<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WiFi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-x pan-y;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a);
            color: #f8fafc;
            padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        h1 { 
            margin-bottom: 40px; font-size: 32px; font-weight: 800;
            background: linear-gradient(to right, #475569, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .container {
            width: 100%; max-width: 400px;
            display: flex; flex-direction: column; gap: 25px;
        }

        .card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px; border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0; transform: translateY(30px);
        }

        .card.show { animation: slideInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }

        .label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; font-weight: 600; }
        .ssid { font-size: 26px; font-weight: 700; margin-bottom: 18px; color: #e2e8f0; }

        .copy-btn {
            width: 100%;
            background-size: 8000% 8000%; 
            color: rgba(255, 255, 255, 0.9); border: none; padding: 18px;
            border-radius: 20px; font-weight: 800; font-size: 15px;
            cursor: pointer; position: relative;
            text-transform: uppercase; letter-spacing: 2px;
            z-index: 1;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 10px 15px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        @keyframes dynamicRGB {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .copy-btn:active { transform: scale(0.96); }

        .info-row {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .status-box, .date-box {
            display: flex; align-items: center; gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px; border-radius: 12px; width: fit-content;
        }
        
        .date { font-size: 13px; color: #94a3b8; }
        .status-text { font-size: 13px; font-weight: 600; }

        /* স্ট্যাটাস কালার লজিক */
        .status-working { color: #10b981; } /* সবুজ */
        .status-not-working { color: #ef4444; } /* লাল */

        #toast {
            visibility: hidden; min-width: 220px;
            backdrop-filter: blur(10px); color: white;
            text-align: center; border-radius: 50px;
            padding: 14px 28px; position: fixed;
            z-index: 100; bottom: 40px; font-weight: 600;
            opacity: 0; transform: translatey(20px);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #toast.show { visibility: visible; opacity: 1; transform: translatey(0); }

        @keyframes slideInUp {
            from { transform: translateY(50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Networks</h1>

    <div class="container" id="wifi-list"></div>

    <div id="toast">Password Copied!</div>

    <script>
        const wifiData = [
            { ssid: "Nayem", date: "08 February 2026", status: "Not Working", pass: "43214321" },
            { ssid: "Manik Molla", date: "08 April 2026", status: "Working", pass: "surujmolla" },
            { ssid: "Monir topadar", date: "08 April 2026", status: "Working", pass: "12341234" },
            { ssid: "Molla Networks", date: "08 April 2026", status: "Working", pass: "01955407770" },
            { ssid: "Habib tapadar", date: "08 April 2026", status: "Working", pass: "habib916" },
            { ssid: "Sakib Topadar 4G", date: "08 April 2026", status: "Working", pass: "12345678" },
            { ssid: "Sakib Topadar 5G", date: "08 April 2026", status: "Working", pass: "12345678" },
            { ssid: "Ayat",date: "16 April 2026", status: "Working", pass: "Ayat12345678" },
        ];

        function getDarkColor() {
            return `hsl(${Math.floor(Math.random() * 360)}, 70%, 25%)`;
        }

        function getMegaGradient() {
            let colors = [];
            for (let i = 0; i < 120; i++) {
                const hue = Math.floor(Math.random() * 360);
                colors.push(`hsl(${hue}, 80%, 35%)`); 
            }
            return `linear-gradient(45deg, ${colors.join(', ')})`;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const listContainer = document.getElementById('wifi-list');
        const shuffledWifiData = shuffle([...wifiData]);

        shuffledWifiData.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const randomGradient = getMegaGradient();
            const randomSpeed = (Math.random() * 60 + 120).toFixed(1); 

            // স্ট্যাটাস অনুযায়ী ক্লাস নির্ধারণ
            const statusClass = item.status.toLowerCase() === "working" ? "status-working" : "status-not-working";

            card.innerHTML = `
                <div class="label">SSID Name</div>
                <div class="ssid">${item.ssid}</div>
                <div class="label">Network Info</div>
                <div class="info-row">
                    <div class="date-box">
                        <span class="date">${item.date}</span>
                    </div>
                    <div class="status-box">
                        <span class="status-text ${statusClass}">${item.status}</span>
                    </div>
                </div>
                <button class="copy-btn" 
                    style="background: ${randomGradient}; background-size: 8000% 8000%; animation: dynamicRGB ${randomSpeed}s linear infinite;"
                    onclick="copyPass('${item.pass}', '${item.ssid}')">
                    PASSWORD
                </button>
            `;
            listContainer.appendChild(card);
        });

        window.addEventListener('load', () => {
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.classList.add('show');
                }, index * 100);
            });
        });

        function copyPass(password, name) {
            navigator.clipboard.writeText(password).then(() => {
                const toast = document.getElementById("toast");
                toast.style.backgroundColor = getDarkColor();
                toast.innerText = name + " Password Copied!";
                toast.classList.add("show");
                
                setTimeout(() => { 
                    toast.classList.remove("show"); 
                }, 4000);
            });
        }
    </script>
</body>
  </html>
