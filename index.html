<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ফিفا ২০২৬ - গ্লোবাল লাইভ ট্র্যাকার</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght=400;600;700&display=swap');

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: linear-gradient(135deg, #050b14 0%, #0a192f 50%, #020c1b 100%);
            font-family: 'Hind Siliguri', sans-serif;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: rgba(10, 25, 47, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px rgba(0, 212, 255, 0.15) solid;
            border-radius: 24px;
            padding: 30px 20px;
            width: 95%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 212, 255, 0.1);
        }

        .fifa-badge {
            background: linear-gradient(90deg, #00d4ff, #0072ff);
            color: #020c1b;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 50px;
            display: inline-block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        /* --- ব্যানার ইমেজ স্টাইল --- */
        .banner-container {
            width: 100%;
            margin-bottom: 25px;
        }

        .banner-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: block;
        }

        /* --- অ্যাকশন বাটন --- */
        .action-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0072ff 0%, #00d4ff 100%);
            color: #020c1b;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px;
            border-radius: 14px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
            transition: data:imagetransform 0.1s ease;
        }
        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
